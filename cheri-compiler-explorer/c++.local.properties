# Default settings for C++
compilers=&cheri-riscv64xx:&cheri-mipsxx:&morelloxx

demangler=/cheri-sdk/bin/llvm-cxxfilt
objdumper=/cheri-sdk/bin/llvm-objdump
objdumperType=llvm
defaultCompiler=cheri-riscv64-purecapxx

group.cheri-mipsxx.compilers=cheri-mips-purecapxx:cheri-mips-hybridxx:cheri-mips-nocherixx
group.cheri-mipsxx.groupName=CHERI Clang (MIPS)
group.cheri-mipsxx.instructionSet=mips
group.cheri-mipsxx.intelAsm=-mllvm --x86-asm-syntax=intel
# TODO: Add libraries to sysroot?
group.cheri-mipsxx.supportsBinary=false

compiler.cheri-mips-purecapxx.exe=/cheri-sdk/bin/clang++
compiler.cheri-mips-purecapxx.name=Purecap CHERI-MIPS
compiler.cheri-mips-purecapxx.options=-target mips64-unknown-freebsd14 --sysroot=/cheri-sdk/sysroot-mips64-purecap -Wall -mabi=purecap -cheri=128 -mcpu=cheri128
compiler.cheri-mips-hybridxx.exe=/cheri-sdk/bin/clang++
compiler.cheri-mips-hybridxx.name=Hybrid CHERI-MIPS
compiler.cheri-mips-hybridxx.options=-target mips64-unknown-freebsd14 --sysroot=/cheri-sdk/sysroot-mips64-purecap -Wall -mabi=n64 -cheri=128 -mcpu=cheri128
compiler.cheri-mips-nocherixx.exe=/cheri-sdk/bin/clang++
compiler.cheri-mips-nocherixx.name=MIPS (without CHERI)
compiler.cheri-mips-nocherixx.options=-target mips64-unknown-freebsd14 --sysroot=/cheri-sdk/sysroot-mips64-purecap -Wall -mabi=n64 -mcpu=beri

group.cheri-riscv64xx.compilers=cheri-riscv64-purecapxx:cheri-riscv64-hybridxx:cheri-riscv64-nocherixx
group.cheri-riscv64xx.groupName=CHERI Clang (RISCV64)
group.cheri-riscv64xx.instructionSet=riscv64
group.cheri-riscv64xx.intelAsm=-mllvm --x86-asm-syntax=intel
# TODO: Add libraries to sysroot?
group.cheri-riscv64xx.supportsBinary=false

compiler.cheri-riscv64-purecapxx.exe=/cheri-sdk/bin/clang++
compiler.cheri-riscv64-purecapxx.name=Purecap CHERI-RISCV64
compiler.cheri-riscv64-purecapxx.options=-target riscv64-unknown-freebsd15 --sysroot=/cheri-sdk/sysroot-riscv64-purecap -Wall -march=rv64imafdcxcheri -mabi=l64pc128d -mno-relax -cheri-tgot-tls
compiler.cheri-riscv64-hybridxx.exe=/cheri-sdk/bin/clang++
compiler.cheri-riscv64-hybridxx.name=Hybrid CHERI-RISCV64
compiler.cheri-riscv64-hybridxx.options=-target riscv64-unknown-freebsd15 --sysroot=/cheri-sdk/sysroot-riscv64-purecap -Wall -march=rv64imafdcxcheri -mabi=lp64d -mno-relax -cheri-tgot-tls
compiler.cheri-riscv64-nocherixx.exe=/cheri-sdk/bin/clang++
compiler.cheri-riscv64-nocherixx.name=RISCV64 (without CHERI)
compiler.cheri-riscv64-nocherixx.options=-target riscv64-unknown-freebsd15 --sysroot=/cheri-sdk/sysroot-riscv64-purecap -Wall -march=rv64imafdc -mabi=lp64d -mno-relax -cheri-tgot-tls

group.morelloxx.compilers=morello-purecapxx:morello-hybridxx:morello-nocherixx
group.morelloxx.groupName=Morello Clang
group.morelloxx.instructionSet=aarch64
group.morelloxx.intelAsm=-mllvm --x86-asm-syntax=intel
# TODO: Add libraries to sysroot?
group.morelloxx.supportsBinary=false

compiler.morello-purecapxx.exe=/morello-sdk/bin/clang++
compiler.morello-purecapxx.name=Purecap Morello
compiler.morello-purecapxx.options=-target aarch64-unknown-freebsd15 --sysroot=/morello-sdk/sysroot-morello-purecap -Wall -march=morello -mabi=purecap --start-no-unused-arguments -cheri-tgot-tls=compat -Xclang -morello-vararg=new -Xclang -morello-bounded-memargs -cheri-codeptr-relocs -Wl,--local-caprelocs=elf --end-no-unused-arguments
compiler.morello-purecapxx.objdumper=/morello-sdk/bin/llvm-objdump
compiler.morello-hybridxx.exe=/morello-sdk/bin/clang++
compiler.morello-hybridxx.name=Hybrid Morello
compiler.morello-hybridxx.options=-target aarch64-unknown-freebsd15 --sysroot=/morello-sdk/sysroot-morello-purecap -Wall -march=morello -mabi=aapcs --start-no-unused-arguments -cheri-tgot-tls=compat -Xclang -morello-vararg=new -Xclang -morello-bounded-memargs -cheri-codeptr-relocs -Wl,--local-caprelocs=elf --end-no-unused-arguments
compiler.morello-hybridxx.objdumper=/morello-sdk/bin/llvm-objdump
compiler.morello-nocherixx.exe=/morello-sdk/bin/clang++
compiler.morello-nocherixx.name=AArch64 (Morello compiler)
compiler.morello-nocherixx.options=-target aarch64-unknown-freebsd15 --sysroot=/morello-sdk/sysroot-morello-purecap -Wall --start-no-unused-arguments -cheri-tgot-tls=compat -Xclang -morello-vararg=new -Xclang -morello-bounded-memargs -cheri-codeptr-relocs -Wl,--local-caprelocs=elf --end-no-unused-arguments
compiler.morello-nocherixx.objdumper=/morello-sdk/bin/llvm-objdump


